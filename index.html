<!DOCTYPE html>
<html>
<head>
  <title>Sertrus2</title>
</head>
<body>
<h1>Sertrus2</h1>

<h2>Create Auction</h2>
<input id="title" placeholder="Title"><br><br>
<input id="starting_price" placeholder="Starting Price"><br><br>
<input id="reserve_price" placeholder="Reserve Price"><br><br>
<button onclick="createAuction()">Create</button>

<h2>Bid</h2>
<input id="auction_id" placeholder="Auction ID"><br><br>
<input id="amount" placeholder="Amount"><br><br>
<button onclick="placeBid()">Bid</button>

<h2>Auctions</h2>
<div id="list">Loading auctions...</div>

<script>
const API = "https://sertrus2-api.chrdjoseph.workers.dev";

async function loadAuctions() {
  const res = await fetch(API + "/auctions");
  const data = await res.json();

  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(a => {
    const div = document.createElement("div");
    div.innerHTML = `
      <hr>
      <b>${a.title}</b><br>
      ID: <input value="${a.id}" style="width:420px"><br>
      Status: ${a.status}<br>
      Current Bid: ${a.current_bid}<br>
      Reserve: ${a.reserve_price}<br>
      <button onclick="document.getElementById('auction_id').value='${a.id}'">Use this ID</button>
    `;
    list.appendChild(div);
  });
}

async function createAuction() {
  const title = document.getElementById("title").value;
  const starting = document.getElementById("starting_price").value;
  const reserve = document.getElementById("reserve_price").value;

  const res = await fetch(
    API + "/create-auction?title=" + encodeURIComponent(title) +
    "&starting_price=" + encodeURIComponent(starting) +
    "&reserve_price=" + encodeURIComponent(reserve)
  );

  const data = await res.json();
  alert("Created auction ID: " + data.id);
  loadAuctions();
}

async function placeBid() {
  const id = document.getElementById("auction_id").value;
  const amount = document.getElementById("amount").value;

  const res = await fetch(
    API + "/bid-test?auction_id=" + encodeURIComponent(id) +
    "&amount=" + encodeURIComponent(amount) +
    "&wallet=test"
  );

  const data = await res.json();
  alert(JSON.stringify(data));
  loadAuctions();
}

loadAuctions();
</script>
</body>
</html>
