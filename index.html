<!DOCTYPE html>
<html>
<head>
  <title>Sertrus2</title>
</head>
<body>
  <h1>Sertrus2</h1>

  <h2>Create Auction</h2>
  <input id="title" placeholder="Title"><br><br>
  <input id="start" placeholder="Starting Price"><br><br>
  <input id="reserve" placeholder="Reserve Price"><br><br>
  <button onclick="createAuction()">Create</button>

  <h2>Bid</h2>
  <input id="auctionId" placeholder="Auction ID"><br><br>
  <input id="amount" placeholder="Amount"><br><br>
  <button onclick="placeBid()">Bid</button>

  <h2>Auctions</h2>
  <div id="list"></div>

<script>
const API = "https://sertrus2-api.chrdjoseph.workers.dev";

async function createAuction() {
  const title = document.getElementById("title").value;
  const start = document.getElementById("start").value;
  const reserve = document.getElementById("reserve").value;

  const res = await fetch(`${API}/create`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ title, start, reserve })
  });

  const data = await res.json();
  alert("Created: " + data.id);
  loadAuctions();
}

async function placeBid() {
  const id = document.getElementById("auctionId").value;
  const amount = document.getElementById("amount").value;

  const res = await fetch(`${API}/bid`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ id, amount })
  });

  const data = await res.json();
  alert(JSON.stringify(data));
  loadAuctions();
}

async function loadAuctions() {
  const res = await fetch(`${API}/auctions`);
  const data = await res.json();

  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(a => {
    const div = document.createElement("div");
    div.innerHTML = `
      <b>${a.title}</b><br>
      Current: ${a.current}<br><br>
    `;
    list.appendChild(div);
  });
}

loadAuctions();
</script>
</body>
</html>
