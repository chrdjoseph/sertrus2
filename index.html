<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sertrus2 | Digital Auctions</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(180deg,#f5f8fc,#eef4ff);
  color:#111;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 20px;
  background:#fff;
  border-bottom:1px solid #eee;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.logo span{color:#2563eb}

.actions button{
  margin-left:8px;
  padding:10px 14px;
  border-radius:10px;
  border:none;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;
}

/* HERO */
.hero{
  text-align:center;
  padding:50px 20px;
}

.hero h1{
  font-size:38px;
  margin-bottom:12px;
}

.hero span{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  color:#555;
  margin-bottom:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
  padding:20px;
}

.card{
  background:#fff;
  padding:16px;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

.badge{
  font-size:12px;
  padding:6px 10px;
  border-radius:20px;
  background:#e0f2fe;
  color:#0284c7;
  display:inline-block;
  margin-bottom:8px;
}

.price{
  font-size:26px;
  font-weight:900;
  color:#0284c7;
}

.countdown{
  margin:10px 0;
  padding:10px;
  background:#111;
  color:#fff;
  border-radius:8px;
  font-family:monospace;
}

button.enter{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

/* TRUST */
.trust{
  padding:30px 20px;
}

.trust h2{
  margin-bottom:10px;
}

.footer{
  padding:20px;
  text-align:center;
  color:#777;
  border-top:1px solid #eee;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">Sertrus<span>2</span></div>
  <div class="actions">
    <button onclick="sell()">Sell</button>
    <button class="primary" onclick="connectWallet()">Connect Wallet</button>
  </div>
</div>

<div class="hero">
  <h1>Win digital products for <span>pennies</span></h1>
  <p>Enter auctions using XRPL or Solana wallets.</p>
</div>

<div id="auctions" class="grid">
  <div class="card">Loading auctions...</div>
</div>

<div class="trust">
  <h2>Trust & Safety</h2>
  <p>Wallet verified entry, transparent payouts, and secure auction system.</p>
</div>

<div class="footer">
  Sertrus2 © 2026
</div>

<script>
const API = "https://sertrus2-api.chrdjoseph.workers.dev";
let wallet = null;

async function loadAuctions(){
  const el = document.getElementById("auctions");

  try{
    const res = await fetch(API + "/auctions");
    const data = await res.json();
    const auctions = Array.isArray(data)?data:data.auctions||[];

    el.innerHTML = auctions.map(a=>{
      const id = a.id||"";
      const title = a.title||"Auction";
      const price = a.current_price||"0.25";
      const end = a.ends_at||"";

      return `
      <div class="card">
        <div class="badge">XRPL AUCTION</div>
        <h3>${title}</h3>
        <div class="price">$${price}</div>
        <div class="countdown" data-end="${end}">Loading...</div>
        <button class="enter" onclick="enterAuction('${id}')">Enter Auction</button>
      </div>`;
    }).join("");

    updateCountdowns();
  }catch(e){
    el.innerHTML = "<div class='card'>Failed to load auctions</div>";
  }
}

function connectWallet(){
  alert("Connect wallet flow (Xaman / Phantom)");
}

function sell(){
  alert("Sell flow → connect wallet → register seller");
}

function enterAuction(id){
  alert("Entering auction " + id + " (payment flow next)");
}

function updateCountdowns(){
  document.querySelectorAll(".countdown").forEach(c=>{
    const end = new Date(c.dataset.end).getTime();
    const diff = end - Date.now();

    if(diff<=0){ c.textContent="Ended"; return; }

    const h=Math.floor(diff/1000/60/60);
    const m=Math.floor((diff/1000/60)%60);
    const s=Math.floor((diff/1000)%60);

    c.textContent=`${h}h ${m}m ${s}s`;
  });
}

setInterval(updateCountdowns,1000);
loadAuctions();
</script>

</body>
</html>
